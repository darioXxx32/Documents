<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyRealmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a36"/>
      <stop offset="40%" stop-color="#2a3266"/>
      <stop offset="70%" stop-color="#5a4282"/>
      <stop offset="100%" stop-color="#d47a88"/>
    </linearGradient>
    <linearGradient id="goldenLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffdda1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffdda1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cielo mágico del reino de Sky -->
  <rect width="600" height="400" fill="url(#skyRealmGrad)"/>

  <!-- Estrellas y constelaciones -->
  <circle cx="80" cy="60" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="120" cy="90" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="200" cy="50" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="480" cy="40" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="530" cy="85" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="420" cy="110" r="1.5" fill="#ffffff" opacity="0.7"/>

  <!-- Líneas tenues de constelación en forma de corazón -->
  <path d="M 270,90 Q 290,70 300,90 Q 310,70 330,90 Q 300,125 300,125 Z" fill="none" stroke="#fff8db" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Nubes esponjosas en las alturas -->
  <path d="M -20,290 Q 60,250 140,280 Q 220,240 310,275 Q 400,245 490,270 Q 560,250 620,290 L 620,400 L -20,400 Z" fill="#ffffff" opacity="0.25"/>
  <path d="M -20,320 Q 90,280 180,310 Q 280,275 380,305 Q 470,285 620,320 L 620,400 L -20,400 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Isla flotante con templo / banco -->
  <ellipse cx="300" cy="310" rx="140" ry="25" fill="#423b4e"/>
  <ellipse cx="300" cy="305" rx="130" ry="20" fill="#677353"/>

  <!-- Dos Niños de la Luz volando tomados de la mano -->
  <!-- Estela de vuelo de luz dorada -->
  <path d="M 120,210 Q 200,160 275,170" fill="none" stroke="url(#goldenLight)" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <path d="M 140,225 Q 210,185 295,178" fill="none" stroke="url(#goldenLight)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Resplandor central de las velas/amor -->
  <circle cx="285" cy="165" r="45" fill="url(#auraGlow)"/>

  <!-- Sky Kid 1 (Capa Roja / Coral) -->
  <g transform="translate(255, 140)">
    <!-- Capa con estrellas de luz -->
    <path d="M 15,18 L -15,42 Q 5,48 18,44 Q 22,35 15,18 Z" fill="#e74c3c"/>
    <circle cx="0" cy="38" r="2" fill="#fff9d2"/>
    <circle cx="10" cy="40" r="2" fill="#fff9d2"/>
    <!-- Cuerpo y máscara con luz -->
    <ellipse cx="18" cy="18" rx="8" ry="10" fill="#2c3e50"/>
    <ellipse cx="16" cy="18" rx="3.5" ry="3.5" fill="#fffab3"/>
    <!-- Cabello / peinado suave -->
    <path d="M 10,10 Q 18,2 24,10 Q 22,20 18,20 Z" fill="#ecf0f1"/>
  </g>

  <!-- Sky Kid 2 (Capa Azul / Teal) -->
  <g transform="translate(295, 145)">
    <!-- Capa con estrellas -->
    <path d="M 5,16 L 35,38 Q 20,46 5,42 Q -2,32 5,16 Z" fill="#16a085"/>
    <circle cx="20" cy="35" r="2" fill="#fff9d2"/>
    <circle cx="10" cy="38" r="2" fill="#fff9d2"/>
    <!-- Cuerpo y máscara -->
    <ellipse cx="3" cy="16" rx="8" ry="10" fill="#2c3e50"/>
    <ellipse cx="4" cy="16" rx="3.5" ry="3.5" fill="#fffab3"/>
    <!-- Cabello con trenza / coleta -->
    <path d="M -3,8 Q 3,1 11,8 Q 9,18 4,18 Z" fill="#ecf0f1"/>
  </g>

  <!-- Sosteniendo las manos y vela compartida -->
  <circle cx="288" cy="165" r="5" fill="#ffd166"/>
  <path d="M 288,160 Q 290,152 288,148 Q 286,152 288,160 Z" fill="#ff7675"/>

  <!-- Texto de recuerdo -->
  <text x="300" y="370" font-family="'Outfit', sans-serif" font-weight="bold" font-size="19" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.6))">
    Volando juntos de la mano entre las estrellas 🌟🕊️
  </text>
</svg>
