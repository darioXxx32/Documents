<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fd746c"/>
      <stop offset="50%" stop-color="#ff9068"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70a33a"/>
      <stop offset="100%" stop-color="#55802b"/>
    </linearGradient>
    <linearGradient id="dirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d5b38"/>
      <stop offset="100%" stop-color="#6d4325"/>
    </linearGradient>
  </defs>

  <!-- Cielo atardecer pixelado -->
  <rect width="600" height="400" fill="url(#skyGrad)"/>
  
  <!-- Sol cuadrado estilo Minecraft -->
  <rect x="250" y="80" width="80" height="80" fill="#fff4cc" rx="4" opacity="0.95"/>
  <rect x="260" y="90" width="60" height="60" fill="#ffffff" rx="2"/>

  <!-- Nubes cuadradas -->
  <rect x="40" y="50" width="160" height="35" fill="#ffffff" opacity="0.6"/>
  <rect x="70" y="30" width="90" height="20" fill="#ffffff" opacity="0.6"/>
  <rect x="420" y="70" width="140" height="30" fill="#ffffff" opacity="0.5"/>

  <!-- Colinas cuadradas de fondo -->
  <polygon points="0,280 80,280 80,240 160,240 160,200 240,200 240,260 380,260 380,220 480,220 480,270 600,270 600,400 0,400" fill="#4d7c2a" opacity="0.6"/>

  <!-- Colinas en primer plano -->
  <rect x="0" y="270" width="600" height="130" fill="url(#dirtGrad)"/>
  <rect x="0" y="260" width="600" height="24" fill="url(#grassGrad)"/>

  <!-- Casita de madera en la colina -->
  <rect x="90" y="190" width="110" height="70" fill="#a47551"/>
  <!-- Techo escalonado -->
  <rect x="80" y="175" width="130" height="15" fill="#754b24"/>
  <rect x="95" y="160" width="100" height="15" fill="#583719"/>
  <!-- Puerta y ventana -->
  <rect x="135" y="220" width="22" height="40" fill="#472b14"/>
  <rect x="105" y="210" width="20" height="20" fill="#aee2ff"/>
  <rect x="165" y="210" width="20" height="20" fill="#aee2ff"/>

  <!-- Dos personajes de Minecraft juntitos -->
  <!-- Personaje 1 -->
  <rect x="340" y="190" width="24" height="24" fill="#fcdbb0"/> <!-- Cabeza -->
  <rect x="340" y="186" width="24" height="8" fill="#4a2e18"/> <!-- Pelo -->
  <rect x="338" y="214" width="28" height="34" fill="#388e3c"/> <!-- Torso -->
  <rect x="341" y="248" width="10" height="20" fill="#1b4965"/> <!-- Pierna izq -->
  <rect x="353" y="248" width="10" height="20" fill="#1b4965"/> <!-- Pierna der -->

  <!-- Personaje 2 -->
  <rect x="375" y="194" width="24" height="24" fill="#ffd1b3"/> <!-- Cabeza -->
  <rect x="373" y="190" width="28" height="10" fill="#6d4c41"/> <!-- Pelo largo -->
  <rect x="373" y="218" width="28" height="30" fill="#e91e63"/> <!-- Torso rosa -->
  <rect x="376" y="248" width="10" height="20" fill="#303f9f"/> <!-- Pierna izq -->
  <rect x="388" y="248" width="10" height="20" fill="#303f9f"/> <!-- Pierna der -->

  <!-- Manos agarradas en el medio -->
  <rect x="364" y="226" width="12" height="10" fill="#fcdbb0"/>

  <!-- Corazón pixelado flotando arriba -->
  <path d="M 368,145 l 6,-6 h 8 v 8 l -14,14 l -14,-14 v -8 h 8 z" fill="#ff1744" transform="scale(1.2) translate(-300, -25)"/>
  
  <text x="300" y="360" font-family="'Outfit', sans-serif" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))">
    Nuestra casita de madera y atardeceres infinitos ⛏️💕
  </text>
</svg>
