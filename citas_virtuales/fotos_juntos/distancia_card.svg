<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ldrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3436"/>
      <stop offset="50%" stop-color="#485460"/>
      <stop offset="100%" stop-color="#d63031"/>
    </linearGradient>
    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#74b9ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#74b9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#ldrBg)"/>

  <!-- Dos pantallas de celular / monitores conectadas por un hilo rojo del destino -->
  <g transform="translate(100, 100)">
    <!-- Pantalla 1 (Él) -->
    <rect x="0" y="0" width="120" height="190" rx="14" fill="#1e272e" stroke="#ffffff" stroke-width="2"/>
    <rect x="8" y="14" width="104" height="162" rx="8" fill="#34495e"/>
    <circle cx="60" cy="80" r="28" fill="#e74c3c"/>
    <text x="60" y="88" font-size="28" text-anchor="middle">👦🏻</text>
    <rect x="25" y="125" width="70" height="10" rx="5" fill="#ecf0f1" opacity="0.6"/>
    <text x="60" y="155" font-family="'Outfit', sans-serif" font-size="12" fill="#2ecc71" text-anchor="middle" font-weight="bold">● En llamada</text>
  </g>

  <g transform="translate(380, 100)">
    <!-- Pantalla 2 (Ella) -->
    <rect x="0" y="0" width="120" height="190" rx="14" fill="#1e272e" stroke="#ffffff" stroke-width="2"/>
    <rect x="8" y="14" width="104" height="162" rx="8" fill="#e84393"/>
    <circle cx="60" cy="80" r="28" fill="#ffeaa7"/>
    <text x="60" y="88" font-size="28" text-anchor="middle">👧🏻</text>
    <rect x="25" y="125" width="70" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
    <text x="60" y="155" font-family="'Outfit', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">● Conectada</text>
  </g>

  <!-- Hilo rojo del destino que conecta ambas pantallas con corazones pulsantes -->
  <path d="M 220,195 C 260,110 340,280 380,195" fill="none" stroke="#ff4757" stroke-width="4" stroke-dasharray="6,4"/>
  <circle cx="300" cy="195" r="26" fill="#ff4757"/>
  <text x="300" y="203" font-size="20" text-anchor="middle" fill="#ffffff">❤️</text>

  <text x="300" y="345" font-family="'Outfit', sans-serif" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.6))">
    Nuestra distancia son solo números, mi amor es infinito ✨🌍
  </text>
</svg>
